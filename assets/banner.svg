<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#48cae4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- circuit grid lines -->
  <g stroke="#1f2a37" stroke-width="1.5">
    <path d="M0 60 H1200"/>
    <path d="M0 240 H1200"/>
    <path d="M150 0 V300"/>
    <path d="M1050 0 V300"/>
  </g>

  <!-- circuit trace accents -->
  <g stroke="#00b4d8" stroke-width="2" fill="none" opacity="0.55">
    <path d="M0 60 H90 L110 40 H150"/>
    <path d="M0 240 H70 L90 260 H150"/>
    <path d="M1050 60 H1130 L1150 40 H1200"/>
    <path d="M1050 240 H1120 L1140 260 H1200"/>
  </g>
  <g fill="#00b4d8" opacity="0.85">
    <circle cx="110" cy="40" r="4"/>
    <circle cx="90" cy="260" r="4"/>
    <circle cx="1150" cy="40" r="4"/>
    <circle cx="1140" cy="260" r="4"/>
  </g>

  <!-- minimal robot head icon -->
  <g transform="translate(80,105)">
    <rect x="0" y="14" width="90" height="70" rx="14" fill="#161b22" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="26" cy="50" r="9" fill="#48cae4"/>
    <circle cx="64" cy="50" r="9" fill="#48cae4"/>
    <rect x="20" y="66" width="50" height="6" rx="3" fill="#48cae4" opacity="0.7"/>
    <line x1="45" y1="14" x2="45" y2="-6" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="45" cy="-10" r="6" fill="#48cae4"/>
    <rect x="-10" y="34" width="10" height="30" rx="4" fill="#161b22" stroke="#48cae4" stroke-width="2"/>
    <rect x="90" y="34" width="10" height="30" rx="4" fill="#161b22" stroke="#48cae4" stroke-width="2"/>
  </g>

  <!-- name + tagline -->
  <text x="230" y="145" font-family="Consolas, 'Courier New', monospace" font-size="46" font-weight="700" fill="#f0f6fc">
    JAKARIA KOLLOL
  </text>
  <text x="230" y="180" font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#48cae4">
    Software Engineer &#183; Data Science &#183; Robotics &amp; Automation
  </text>
  <text x="230" y="208" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8b949e">
    Building intelligent systems — from embedded control to federated learning
  </text>
</svg>
